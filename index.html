<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#091127"><title>Kimi · Shooting Wishes</title>
<link rel="icon" href="assets/images/stars/gold-star.png"><link rel="stylesheet" href="css/game.css">
</head>
<body>
<main data-scene="start" id="game" aria-label="Catch the stars · Shooting Wishes">
<video id="background" playsinline preload="auto" aria-hidden="true"></video>
<div id="still-background" aria-hidden="true"></div>
<div id="veil"></div>
<div id="red-flash" aria-hidden="true"></div>
<div id="playfield" aria-label="Catch white and gold stars, avoid red stars"></div>
<div id="timer" hidden role="progressbar" aria-label="Time remaining" aria-valuemin="0" aria-valuemax="60"><div id="time-fill"></div></div>
<button id="sound" aria-label="Mute sound" hidden>♪</button>
<section id="start-screen" class="screen"><div class="start-content"><div data-art="rules-frame"></div><button id="start" class="image-button" aria-label="Start Game" disabled></button><p id="loading" role="status">Loading the stars…</p></div></section>
<div id="countdown" hidden aria-live="polite"></div>
<div id="announcement" hidden></div>
<div id="hud" hidden><div id="wishes"><div data-art="wishes-counter-frame"></div><output id="score">0</output><div id="combo" data-art="combo-x2" hidden></div></div><div id="best"><div data-art="best-score-frame"></div><output id="best-value">0</output></div></div>
<section id="end-screen" class="screen" hidden aria-label="Results"><div class="end-content">
<div id="result"><div data-art="result-frame"></div><output id="final-score">0</output><div id="record" data-art="new-best-score" hidden></div></div>
<section id="leaderboard" aria-labelledby="leaderboard-title" lang="en">
<h2 id="leaderboard-title" class="sr-only">Top five scores</h2>
<div id="top-five"><div data-art="top5-score"></div><ol id="leaderboard-rows" aria-label="Top five games"></ol></div>
<div class="leaderboard-controls"><button id="refresh-scores" type="button" aria-label="Refresh leaderboard">↻</button></div>
<p id="leaderboard-empty" hidden>The stars await their first champion ✨</p>
<form id="score-form"><div class="score-fields"><input id="player-name" name="name" maxlength="20" required autocomplete="nickname" aria-label="Your name" placeholder="Your name"><button id="save-score" type="submit" aria-label="Save score" disabled><img src="assets/images/buttons/save-score.png" alt="" width="2172" height="724"></button></div></form>
<p id="score-status" role="status"></p>
<p id="leaderboard-status" role="status"></p>
</section>
<div class="end-buttons"><button id="replay" class="image-button" aria-label="Replay"></button><button id="next" class="image-button" aria-label="Next" hidden></button></div><p id="next-message" role="status" hidden></p>
</div></section>
<button id="resume" hidden>Tap to resume ♪</button>
</main><script type="module" src="js/game.js"></script>
<script type="module">if(new URLSearchParams(location.search).has("test")) import("./tests/browser-check.js");</script></body></html>
